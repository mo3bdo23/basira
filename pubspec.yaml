name: basira
description: "بصيرة (Basira) — تطبيق صوتي بالكامل لتمكين ذوي الإعاقة البصرية في مصر من التنقل بأمان واستقلالية. Voice-first navigation for blind and low-vision students in Egypt."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── الصوت ────────────────────────────────────────────────
  flutter_tts: ^3.8.5
  speech_to_text: ^7.5.0

  # ── الموقع والخرائط ──────────────────────────────────────
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ── التخزين المحلي (Offline-first) ───────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0

  # ── أدوات ────────────────────────────────────────────────
  provider: ^6.1.2
  url_launcher: ^6.2.0
  uuid: ^4.2.0
  http: ^1.1.0

  # ── Firebase (اختياري — التطبيق يعمل كاملًا بدونه) ───────
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/universities.json
    - assets/data/routes.json
    - assets/data/traffic_signals.json
    - assets/data/obstacles_seed.json
    - assets/images/app_icon.png
